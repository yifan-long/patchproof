[project]
name = "patchproof"
version = "0.3.7"
description = "An evidence-first coding-agent harness for verifiable local repository changes"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.100.0",
    "openai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchproof"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".pytest*",
    ".uv-cache",
    ".venv",
    "data",
    "frontend/dist",
    "frontend/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
